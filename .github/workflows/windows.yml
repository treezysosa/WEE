name: Windows VST3 build
on:
  push:
    paths-ignore:
      - "docs/**"
      - "README.md"
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: MSVC 2022 x64 Release
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Identify runner image
        id: image
        shell: pwsh
        run: '"version=$env:ImageVersion" >> $env:GITHUB_OUTPUT'
      - name: Restore compiled JUCE dependencies
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: build
          key: wee-vs2022-${{ steps.image.outputs.version }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: wee-vs2022-${{ steps.image.outputs.version }}-
      - name: Configure Visual Studio 2022
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build VST3, standalone and tests
        id: compile
        run: cmake --build build --config Release --parallel 2
      - name: Cache successful compilation
        if: steps.compile.outcome == 'success' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Run generation, MIDI, audio and state tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Record scheduler and callback profiles
        if: always()
        shell: pwsh
        run: |
          if (Test-Path 'build/Testing/Temporary/LastTest.log') {
            Select-String -LiteralPath 'build/Testing/Temporary/LastTest.log' -Pattern 'PROFILE |100k dense blocks|PASS: real note' | ForEach-Object { Write-Host $_.Line }
          }
      - name: Verify legacy 32-bit PowerShell installer recovery
        shell: pwsh
        run: |
          & "$env:SystemRoot/SysWOW64/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -ExecutionPolicy Bypass -File ./tests/InstallerTests.ps1
          if ($LASTEXITCODE -ne 0) { throw '32-bit PowerShell recovery tests failed' }
      - name: Verify real standalone window and VST3 module loading
        shell: pwsh
        run: ./tests/WindowsStartup.ps1
      - name: Verify launch diagnostics in Windows PowerShell
        shell: pwsh
        run: |
          & "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -ExecutionPolicy Bypass -File ./tests/WindowsStartup.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell startup checks failed' }
      - name: Verify no external MSVC runtime dependency
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vsRoot = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vsRoot) { throw 'Visual Studio C++ installation not found' }
          $dumpbin = Get-ChildItem (Join-Path $vsRoot 'VC/Tools/MSVC/*/bin/Hostx64/x64/dumpbin.exe') | Sort-Object FullName -Descending | Select-Object -First 1
          if (!$dumpbin) { throw 'MSVC dumpbin not found' }
          foreach ($binary in @('build/WEE_artefacts/Release/Standalone/WEE.exe','build/WEE_artefacts/Release/VST3/WEE.vst3/Contents/x86_64-win/WEE.vst3')) {
            $dependencies = & $dumpbin.FullName /DEPENDENTS $binary
            $dependencies | Write-Host
            if ($LASTEXITCODE -ne 0 -or ($dependencies -match '(?i)(vcruntime|msvcp|ucrtbase).*\.dll')) { throw 'External C++ runtime dependency remains' }
          }
      - name: Assemble installable Windows package
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Verify installer on the clean Windows runner
        shell: pwsh
        run: |
          ./dist/WEE-Windows-x64/Install-WEE.ps1
          $installed = Join-Path $env:CommonProgramFiles 'VST3/WEE.vst3/Contents/x86_64-win/WEE.vst3'
          if (!(Test-Path $installed)) { throw 'Installer did not create the VST3 binary' }
          $sourceHash = (Get-FileHash 'dist/WEE-Windows-x64/WEE.vst3/Contents/x86_64-win/WEE.vst3').Hash
          if ((Get-FileHash $installed).Hash -ne $sourceHash) { throw 'Installed binary differs from build' }
          ./dist/WEE-Windows-x64/Verify-WEE.ps1
          ./dist/WEE-Windows-x64/Install-WEE.ps1 -Replace
          ./scripts/install-vst3.ps1 -Replace
          ./dist/WEE-Windows-x64/Verify-WEE.ps1
          if (!(Get-ChildItem (Join-Path $env:CommonProgramFiles 'VST3') -Filter 'WEE.vst3.backup-*')) { throw 'Replacement backup missing' }
      - name: Upload Windows download
        uses: actions/upload-artifact@v4
        with:
          name: WEE-Windows-x64
          path: dist/WEE-Windows-x64/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WEE-test-results
          path: |
            build/Testing/Temporary/LastTest.log
            build/startup-diagnostics/*
          if-no-files-found: ignore
